        <button id="slideshowToggleBtn" type="button" class="hover:text-[#f7f3ee] flex items-center gap-1 font-semibold transition-colors cursor-pointer">

      >

      >

      <button

      <button id="mobileSlideshowToggleBtn" type="button" class="hover:text-[#f7f3ee] flex items-center gap-1 cursor-pointer">
        <svg id="mobileIconPlay" class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="mobileIconPause" class="w-3 h-3 hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="3" height="16"/><rect x="15" y="4" width="3" height="16"/></svg>
        <span id="mobileSlideshowLabel">Slide</span>

      <span id="mobileSlideshowSpeedReadout" class="w-4 text-center font-mono">2s</span>

    <button

    >

    <div id="discreteStage" class="relative w-screen h-screen flex items-center justify-center cursor-grab active:cursor-grabbing overflow-hidden">

        <img id="modalImgOutgoing" src="" alt="" class="max-w-[96vw] max-h-[90vh] w-auto h-auto object-contain rounded-lg shadow-2xl" />

      <div id="modalCardCurrent" class="relative w-full h-full flex items-center justify-center">
        <img id="modalImgCurrent" src="" alt="" class="max-w-[96vw] max-h-[90vh] w-auto h-auto object-contain rounded-lg shadow-2xl" />
        <video id="modalVideoCurrent" controls playsinline class="hidden max-w-[96vw] max-h-[90vh] w-auto h-auto object-contain bg-black rounded-lg shadow-2xl"></video>

  <script>
    const GALLERY_CONFIG = window.GALLERY_CONFIG;

    function extractCleanFolderId(rawInput) {
      const str = (rawInput || "").trim();
      const match = str.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) return match[1];
      const idParam = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idParam && idParam[1]) return idParam[1];
      return str;
    }

    function classifyMediaItem(file) {
      let targetId = file.id;
      let mime = (file.mimeType || "").toLowerCase();
      const name = (file.name || "").toLowerCase();
      if (mime === "application/vnd.google-apps.shortcut" && file.shortcutDetails) {
        targetId = file.shortcutDetails.targetId || file.id;
        mime = (file.shortcutDetails.targetMimeType || "").toLowerCase();
      }
      const isImage = mime.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic)$/i.test(name);
      const isVideo = mime.startsWith("video/") || /\.(mp4|mov|webm)$/i.test(name);
      return { isMedia: isImage || isVideo, isVideo, effectiveId: targetId };
    }

    let galleryItems = [];
    async function loadGoogleDriveGallery() {
      const statusBadge = document.getElementById("driveSyncStatus");
      if (statusBadge) statusBadge.classList.remove("hidden");

      const folderId = extractCleanFolderId(GALLERY_CONFIG.googleDriveFolderId);
      const apiKey = (GALLERY_CONFIG.googleDriveApiKey || "").trim();

      try {
        const query = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
        const fields = encodeURIComponent("files(id, name, mimeType, thumbnailLink, shortcutDetails)");
        const url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=${fields}&pageSize=200&orderBy=createdTime%20desc&key=${encodeURIComponent(apiKey)}`;
        
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || "Drive error");

        const mediaEntries = [];
        (data.files || []).forEach(file => {
          const info = classifyMediaItem(file);
          if (info.isMedia) mediaEntries.push({ file, info });
        });

        galleryItems = mediaEntries.map(({ file, info }, idx) => {
          const fileId = info.effectiveId;
          const directUrl = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(apiKey)}`;
          return {
            id: fileId,
            name: file.name || `Memory-${idx + 1}`,
            isVideo: info.isVideo,
            thumbnailUrl: file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, "=s300") : directUrl,
            fullUrl: directUrl,
            downloadUrl: directUrl
          };
        });

        renderScatteredGrid();
      } catch (err) {
        console.error(err);
      } finally {
        if (statusBadge) statusBadge.classList.add("hidden");
      }
    }

    function renderScatteredGrid() {
      const grid = document.getElementById("scatteredGalleryGrid");
      if (!grid) return;
      grid.innerHTML = "";

      galleryItems.forEach((item, idx) => {
        const fig = document.createElement("figure");
        fig.className = "relative aspect-[1/1.25] w-full p-2 rounded-2xl bg-[#171614]/90 border border-[#c5a059]/35 cursor-pointer group";
        fig.innerHTML = `
          <div class="relative w-full h-full overflow-hidden rounded-xl bg-[#0e0e0d]">
            <img src="${item.thumbnailUrl}" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          </div>
        `;
        fig.addEventListener("click", () => openStickyModal(idx));
        grid.appendChild(fig);
      });
    }

    // Lightbox Logic
    const stickyModalOverlay = document.getElementById("stickyModalOverlay");
    const modalImgCurrent = document.getElementById("modalImgCurrent");
    let currentModalIndex = 0;
    let isSlideshowActive = false;
    let slideshowTimer = null;
    let slideshowIntervalSeconds = GALLERY_CONFIG.slideshowDefaultSeconds || 2;

    function openStickyModal(index) {
      currentModalIndex = index;
      renderActiveMediaInModal(galleryItems[currentModalIndex]);
      stickyModalOverlay.classList.remove("hidden");
      stickyModalOverlay.classList.add("flex");
      document.body.style.overflow = "hidden";
      history.pushState({ modalOpen: true }, "");
    }

    function closeStickyModal() {
      stopSlideshow();
      stickyModalOverlay.classList.add("hidden");
      stickyModalOverlay.classList.remove("flex");
      document.body.style.overflow = "";
    }

    window.addEventListener("popstate", () => {
      if (!stickyModalOverlay.classList.contains("hidden")) {
        closeStickyModal();
      }
    });

    function renderActiveMediaInModal(item) {
      if (item) modalImgCurrent.src = item.fullUrl;
    }

    function transitionToPhoto(targetIndex) {
      const total = galleryItems.length;
      currentModalIndex = ((targetIndex % total) + total) % total;
      renderActiveMediaInModal(galleryItems[currentModalIndex]);
    }

    function startSlideshow() {
      isSlideshowActive = true;
      updateSlideshowUI();
      scheduleNextSlide();
    }

    function stopSlideshow() {
      isSlideshowActive = false;
      if (slideshowTimer) clearTimeout(slideshowTimer);
      updateSlideshowUI();
    }

    function toggleSlideshow() {
      if (isSlideshowActive) stopSlideshow();
      else startSlideshow();
    }

    function scheduleNextSlide() {
      if (!isSlideshowActive) return;
      if (slideshowTimer) clearTimeout(slideshowTimer);
      slideshowTimer = setTimeout(() => {
        if (isSlideshowActive) {
          transitionToPhoto(currentModalIndex + 1);
          scheduleNextSlide();
        }
      }, slideshowIntervalSeconds * 1000);
    }

    function updateSlideshowUI() {
      const label = document.getElementById("slideshowLabel");
      const mLabel = document.getElementById("mobileSlideshowLabel");
      const readout = document.getElementById("slideshowSpeedReadout");
      const mReadout = document.getElementById("mobileSlideshowSpeedReadout");
      if (readout) readout.textContent = `${slideshowIntervalSeconds}s`;
      if (mReadout) mReadout.textContent = `${slideshowIntervalSeconds}s`;
      if (label) label.textContent = isSlideshowActive ? "Pause" : "Slide";
      if (mLabel) mLabel.textContent = isSlideshowActive ? "Pause" : "Slide";
    }

    document.getElementById("slideshowToggleBtn")?.addEventListener("click", toggleSlideshow);
    document.getElementById("mobileSlideshowToggleBtn")?.addEventListener("click", toggleSlideshow);

    function changeSpeed(delta) {
      slideshowIntervalSeconds = clamp(slideshowIntervalSeconds + delta, 1, 15);
      updateSlideshowUI();
      if (isSlideshowActive) scheduleNextSlide();
    }

    document.getElementById("slideshowSpeedMinus")?.addEventListener("click", () => changeSpeed(-1));
    document.getElementById("slideshowSpeedPlus")?.addEventListener("click", () => changeSpeed(1));
    document.getElementById("mobileSlideshowSpeedMinus")?.addEventListener("click", () => changeSpeed(-1));
    document.getElementById("mobileSlideshowSpeedPlus")?.addEventListener("click", () => changeSpeed(1));

    document.getElementById("modalPrevBtn")?.addEventListener("click", () => transitionToPhoto(currentModalIndex - 1));
    document.getElementById("modalNextBtn")?.addEventListener("click", () => transitionToPhoto(currentModalIndex + 1));
    document.getElementById("closeStickyModalBtn")?.addEventListener("click", () => window.history.back());

    document.getElementById("backToInvitationBtn")?.addEventListener("click", () => {
      const container = document.getElementById("dynamicPageContainer");
      const landing = document.getElementById("landingPortalView");
      if (container) container.classList.add("hidden");
      if (landing) landing.classList.remove("hidden");
    });

    window.onload = function() {
      loadGoogleDriveGallery();
    };
  </script>
</body>
