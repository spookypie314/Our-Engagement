  <script>
    const SITE_CONFIG = window.SITE_CONFIG;

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function extractCleanFolderId(rawInput) {
      const str = (rawInput || "").trim();
      const match = str.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) return match[1];
      const idParam = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idParam && idParam[1]) return idParam[1];
      return str;
    }

    function classifyMediaItem(file) {
      let targetId = file.id;
      let mime = (file.mimeType || "").toLowerCase();
      const name = (file.name || "").toLowerCase();
      if (mime === "application/vnd.google-apps.shortcut" && file.shortcutDetails) {
        targetId = file.shortcutDetails.targetId || file.id;
        mime = (file.shortcutDetails.targetMimeType || "").toLowerCase();
      }
      const isImage = mime.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic|heif|avif|bmp|tiff?)$/i.test(name);
      const isVideo = mime.startsWith("video/") || /\.(mp4|mov|webm|m4v|mkv|avi|3gp)$/i.test(name);
      return { isMedia: isImage || isVideo, isVideo, effectiveId: targetId, effectiveMime: mime };
    }

    let galleryItems = [];
    let galleryScrollRestorationY = 0;

    function showDriveDiagnostic(title, detailsHtml) {
      const errBox = document.getElementById("driveErrorContainer");
      const errTitle = document.getElementById("driveErrorTitle");
      const errDetails = document.getElementById("driveErrorDetails");
      if (!errBox || !errTitle || !errDetails) return;
      errTitle.textContent = title;
      errDetails.innerHTML = detailsHtml;
      errBox.classList.remove("hidden");
    }

    async function fetchDriveFolderContents(folderId, apiKey) {
      let items = [];
      let pageToken = "";
      do {
        const query = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
        const fields = encodeURIComponent("nextPageToken, files(id, name, mimeType, thumbnailLink, webContentLink, shortcutDetails)");
        const pageParam = pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "";
        const url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=${fields}&pageSize=500&orderBy=createdTime%20desc&supportsAllDrives=true&includeItemsFromAllDrives=true${pageParam}&key=${encodeURIComponent(apiKey)}`;
        const response = await fetch(url);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data?.error?.message || `HTTP ${response.status}`);
        if (Array.isArray(data.files)) items = items.concat(data.files);
        pageToken = data.nextPageToken || "";
      } while (pageToken);
      return items;
    }

    async function loadGoogleDriveGallery() {
      const statusBadge = document.getElementById("driveSyncStatus");
      const counterBadge = document.getElementById("photoCounterBadge");
      if (statusBadge) statusBadge.classList.remove("hidden");

      const folderId = extractCleanFolderId(SITE_CONFIG.googleDriveFolderId);
      const apiKey = (SITE_CONFIG.googleDriveApiKey || "").trim();

      try {
        const topLevelFiles = await fetchDriveFolderContents(folderId, apiKey);
        let allFiles = [...topLevelFiles];

        const mediaEntries = [];
        for (const file of allFiles) {
          const info = classifyMediaItem(file);
          if (info.isMedia) mediaEntries.push({ file, info });
        }

        if (mediaEntries.length === 0) {
          galleryItems = [];
          renderScatteredGrid();
          showDriveDiagnostic("Folder Connected — 0 Photos Found", "Please ensure your Google Drive folder contains engagement photos and is shared as <strong>Anyone with the link can view</strong>.");
          return;
        }

        galleryItems = mediaEntries.map(({ file, info }, idx) => {
          const fileId = info.effectiveId;
          const isVideo = info.isVideo;
          const directMediaUrl = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(apiKey)}`;
          const lowResThumb = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, "=s300") : `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w300`;
          const fullMediaUrl = isVideo ? directMediaUrl : (file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, "=s2400") : directMediaUrl);

          return {
            id: fileId,
            name: file.name || `Memory-${idx + 1}`,
            isVideo,
            thumbnailUrl: lowResThumb,
            fullUrl: fullMediaUrl,
            downloadUrl: directMediaUrl
          };
        });

        if (counterBadge) counterBadge.textContent = `${galleryItems.length} Memories`;
        renderScatteredGrid();
      } catch (err) {
        showDriveDiagnostic("Google Drive API Error", err.message);
      } finally {
        if (statusBadge) statusBadge.classList.add("hidden");
      }
    }

    function renderScatteredGrid() {
      const grid = document.getElementById("scatteredGalleryGrid");
      if (!grid) return;
      grid.innerHTML = "";

      galleryItems.forEach((item, idx) => {
        const fig = document.createElement("figure");
        fig.className = "relative z-10 m-0 cursor-pointer group";
        const isEven = idx % 2 === 0;
        const initialTilt = isEven ? "-1.5deg" : "1.5deg";

        const videoBadge = item.isVideo ? `
          <div class="absolute inset-0 flex items-center justify-center bg-black/25 pointer-events-none">
            <div class="w-8 h-8 rounded-full bg-[#0e0e0d]/80 border border-[#e5c378]/70 flex items-center justify-center text-[#e5c378] shadow-lg">
              <svg class="w-3.5 h-3.5 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>` : "";

        fig.innerHTML = `
          <div class="relative aspect-[1/1.25] w-full p-2 rounded-2xl bg-[#171614]/90 border border-[#c5a059]/35 hover:border-[#e5c378] transition-all duration-300 shadow-lg group-hover:shadow-[0_15px_35px_rgba(197,160,89,0.2)]" style="transform: rotateZ(${initialTilt});">
            <div class="relative w-full h-full overflow-hidden rounded-xl bg-[#0e0e0d]">
              <img src="${item.thumbnailUrl}" alt="${item.name}" loading="lazy" referrerpolicy="no-referrer" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
              ${videoBadge}
            </div>
          </div>
        `;

        fig.addEventListener("click", () => {
          galleryScrollRestorationY = window.scrollY || window.pageYOffset;
          openStickyModal(idx);
        });

        grid.appendChild(fig);
      });
    }

    // Lightbox & Slideshow & Zoom logic
    const stickyModalOverlay = document.getElementById("stickyModalOverlay");
    const discreteStage = document.getElementById("discreteStage");
    const modalCardCurrent = document.getElementById("modalCardCurrent");
    const modalImgCurrent = document.getElementById("modalImgCurrent");
    const modalVideoCurrent = document.getElementById("modalVideoCurrent");
    const resetZoomBtn = document.getElementById("resetZoomBtn");
    const zoomLevelReadout = document.getElementById("zoomLevelReadout");

    let currentModalIndex = 0;
    let userZoomScale = 1, userPanX = 0, userPanY = 0, userRotationDeg = 0;
    let isDragging = false, dragStartX = 0, dragStartY = 0, dragCurrentX = 0, dragCurrentY = 0;
    let panStartOffsetX = 0, panStartOffsetY = 0, isTransitioning = false;
    let isPinching = false, pinchStartDist = 0, pinchStartScale = 1, lastTapTimestamp = 0;

    let isSlideshowActive = false, slideshowTimer = null, slideshowIntervalSeconds = SITE_CONFIG.slideshowDefaultSeconds;

    function applyUserTransform(animate = false) {
      const ease = animate ? "transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)" : "none";
      modalImgCurrent.style.transition = ease;
      modalImgCurrent.style.transform = `translate3d(${userPanX}px, ${userPanY}px, 0px) scale(${userZoomScale}) rotate(${userRotationDeg}deg)`;

      if (resetZoomBtn && zoomLevelReadout) {
        if (userZoomScale > 1.02) {
          resetZoomBtn.classList.remove("hidden");
          resetZoomBtn.classList.add("flex");
          zoomLevelReadout.textContent = `${Math.round(userZoomScale * 100)}%`;
        } else {
          resetZoomBtn.classList.add("hidden");
          resetZoomBtn.classList.remove("flex");
        }
      }
    }

    function resetZoomAndRotation(animate = false) {
      userZoomScale = 1; userPanX = 0; userPanY = 0; userRotationDeg = 0;
      applyUserTransform(animate);
    }

    function openStickyModal(idx) {
      if (!galleryItems.length) return;
      currentModalIndex = ((idx % galleryItems.length) + galleryItems.length) % galleryItems.length;
      renderActiveMediaInModal(galleryItems[currentModalIndex]);
      stickyModalOverlay.classList.remove("hidden");
      stickyModalOverlay.classList.add("flex");
      document.body.style.overflow = "hidden";
      history.pushState({ modalOpen: true }, "");
    }

    function closeStickyModal() {
      stopSlideshow();
      modalVideoCurrent.pause();
      modalVideoCurrent.removeAttribute("src");
      resetZoomAndRotation(false);
      stickyModalOverlay.classList.add("hidden");
      stickyModalOverlay.classList.remove("flex");
      document.body.style.overflow = "";
      window.scrollTo({ top: galleryScrollRestorationY, behavior: "instant" });
    }

    function renderActiveMediaInModal(item) {
      resetZoomAndRotation(false);
      if (item.isVideo) {
        modalImgCurrent.classList.add("hidden");
        modalVideoCurrent.classList.remove("hidden");
        modalVideoCurrent.src = item.fullUrl;
        modalVideoCurrent.play().catch(() => {});
      } else {
        modalVideoCurrent.pause();
        modalVideoCurrent.removeAttribute("src");
        modalVideoCurrent.classList.add("hidden");
        modalImgCurrent.classList.remove("hidden");
        modalImgCurrent.src = item.fullUrl;
      }
    }

    function toggleSlideshow() {
      if (isSlideshowActive) stopSlideshow();
      else startSlideshow();
    }
    function startSlideshow() { isSlideshowActive = true; updateSlideshowUI(); scheduleNextSlide(); }
    function stopSlideshow() { isSlideshowActive = false; if (slideshowTimer) clearTimeout(slideshowTimer); updateSlideshowUI(); }
    function scheduleNextSlide() {
      if (!isSlideshowActive) return;
      slideshowTimer = setTimeout(() => {
        if (isSlideshowActive) { transitionToPhoto(currentModalIndex + 1); scheduleNextSlide(); }
      }, slideshowIntervalSeconds * 1000);
    }
    function updateSlideshowUI() {
      const lbl = document.getElementById("slideshowLabel");
      const mlbl = document.getElementById("mobileSlideshowLabel");
      const iconPlay = document.getElementById("slideshowIconPlay");
      const iconPause = document.getElementById("slideshowIconPause");
      const mPlay = document.getElementById("mobileIconPlay");
      const mPause = document.getElementById("mobileIconPause");

      if (lbl) lbl.textContent = isSlideshowActive ? "Pause" : "Slide";
      if (mlbl) mlbl.textContent = isSlideshowActive ? "Pause" : "Slide";
      if (iconPlay) iconPlay.classList.toggle("hidden", isSlideshowActive);
      if (iconPause) iconPause.classList.toggle("hidden", !isSlideshowActive);
      if (mPlay) mPlay.classList.toggle("hidden", isSlideshowActive);
      if (mPause) mPause.classList.toggle("hidden", !isSlideshowActive);
    }

    function changeSpeed(delta) {
      slideshowIntervalSeconds = clamp(slideshowIntervalSeconds + delta, 1, 15);
      const r1 = document.getElementById("slideshowSpeedReadout");
      const r2 = document.getElementById("mobileSlideshowSpeedReadout");
      if (r1) r1.textContent = `${slideshowIntervalSeconds}s`;
      if (r2) r2.textContent = `${slideshowIntervalSeconds}s`;
      if (isSlideshowActive) scheduleNextSlide();
    }

    document.getElementById("slideshowToggleBtn")?.addEventListener("click", toggleSlideshow);
    document.getElementById("mobileSlideshowToggleBtn")?.addEventListener("click", toggleSlideshow);
    document.getElementById("slideshowSpeedMinus")?.addEventListener("click", () => changeSpeed(-1));
    document.getElementById("slideshowSpeedPlus")?.addEventListener("click", () => changeSpeed(1));
    document.getElementById("mobileSlideshowSpeedMinus")?.addEventListener("click", () => changeSpeed(-1));
    document.getElementById("mobileSlideshowSpeedPlus")?.addEventListener("click", () => changeSpeed(1));

    function transitionToPhoto(targetIdx) {
      if (isTransitioning || !galleryItems.length) return;
      isTransitioning = true;
      currentModalIndex = ((targetIdx % galleryItems.length) + galleryItems.length) % galleryItems.length;
      renderActiveMediaInModal(galleryItems[currentModalIndex]);
      setTimeout(() => { isTransitioning = false; }, 300);
    }

    document.getElementById("closeStickyModalBtn")?.addEventListener("click", () => {
      if (window.history.state?.modalOpen) window.history.back();
      else closeStickyModal();
    });
    document.getElementById("modalPrevBtn")?.addEventListener("click", () => transitionToPhoto(currentModalIndex - 1));
    document.getElementById("modalNextBtn")?.addEventListener("click", () => transitionToPhoto(currentModalIndex + 1));
    document.getElementById("rotateMediaBtn")?.addEventListener("click", () => {
      userRotationDeg = (userRotationDeg + 90) % 360;
      applyUserTransform(true);
    });
    document.getElementById("resetZoomBtn")?.addEventListener("click", () => resetZoomAndRotation(true));
    document.getElementById("downloadMediaBtn")?.addEventListener("click", () => {
      const item = galleryItems[currentModalIndex];
      if (item) window.open(item.downloadUrl, "_blank");
    });

    // Zoom & Pan gesture handlers
    function getTouchDist(t) {
      return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    }

    discreteStage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        isDragging = false; isPinching = true;
        pinchStartDist = getTouchDist(e.touches);
        pinchStartScale = userZoomScale;
      } else if (e.touches.length === 1) {
        const now = Date.now();
        const t = e.touches[0];
        if (now - lastTapTimestamp < 280) {
          if (userZoomScale > 1.05) resetZoomAndRotation(true);
          else { userZoomScale = 2.5; userPanX = 0; userPanY = 0; applyUserTransform(true); }
          lastTapTimestamp = 0; return;
        }
        lastTapTimestamp = now;
        isDragging = true;
        dragStartX = t.clientX; dragStartY = t.clientY;
        dragCurrentX = t.clientX; dragCurrentY = t.clientY;
        panStartOffsetX = userPanX; panStartOffsetY = userPanY;
      }
    }, { passive: true });

    discreteStage.addEventListener("touchmove", (e) => {
      if (isPinching && e.touches.length === 2) {
        const dist = getTouchDist(e.touches);
        if (pinchStartDist > 0) {
          userZoomScale = clamp(pinchStartScale * (dist / pinchStartDist), 1, 5);
          if (userZoomScale <= 1.02) { userPanX = 0; userPanY = 0; }
          applyUserTransform(false);
        }
      } else if (isDragging && e.touches.length === 1) {
        dragCurrentX = e.touches[0].clientX; dragCurrentY = e.touches[0].clientY;
        const dx = dragCurrentX - dragStartX; const dy = dragCurrentY - dragStartY;
        if (userZoomScale > 1.02) {
          userPanX = panStartOffsetX + dx; userPanY = panStartOffsetY + dy;
          applyUserTransform(false);
        } else if (Math.abs(dx) > 60 && Math.abs(dy) < 40) {
          isDragging = false;
          if (dx < 0) transitionToPhoto(currentModalIndex + 1);
          else transitionToPhoto(currentModalIndex - 1);
        }
      }
    }, { passive: true });

    discreteStage.addEventListener("touchend", (e) => {
      if (isPinching && e.touches.length < 2) { isPinching = false; }
      if (e.touches.length === 0) { isDragging = false; }
    });

    discreteStage.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 0.88;
      userZoomScale = clamp(userZoomScale * factor, 1, 5);
      if (userZoomScale <= 1.03) resetZoomAndRotation(true);
      else applyUserTransform(true);
    }, { passive: false });

    discreteStage.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY;
        panStartOffsetX = userPanX; panStartOffsetY = userPanY;
      }
    });
    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX; const dy = e.clientY - dragStartY;
      if (userZoomScale > 1.02) {
        userPanX = panStartOffsetX + dx; userPanY = panStartOffsetY + dy;
        applyUserTransform(false);
      }
    });
    window.addEventListener("mouseup", () => { isDragging = false; });

    window.addEventListener("popstate", () => {
      if (!stickyModalOverlay.classList.contains("hidden")) closeStickyModal();
    });

    window.onload = function() {
      loadGoogleDriveGallery();
    };
  </script>
</body>
</html>
