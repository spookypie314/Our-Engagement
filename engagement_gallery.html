  <script>
    const SITE_CONFIG = window.SITE_CONFIG;

    function scrollToTopSmooth() { window.scrollTo({ top: 0, behavior: "smooth" }); }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function extractCleanFolderId(raw) {
      const str = (raw || "").trim();
      const m1 = str.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (m1 && m1[1]) return m1[1];
      const m2 = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m2 && m2[1]) return m2[1];
      return str;
    }

    function classifyMediaItem(file) {
      let targetId = file.id;
      let mime = (file.mimeType || "").toLowerCase();
      const name = (file.name || "").toLowerCase();
      if (mime === "application/vnd.google-apps.shortcut" && file.shortcutDetails) {
        targetId = file.shortcutDetails.targetId || file.id;
        mime = (file.shortcutDetails.targetMimeType || "").toLowerCase();
      }
      const isVideo = mime.startsWith("video/") || /\.(mp4|mov|webm|m4v|mkv|avi|3gp)$/i.test(name);
      const isImage = mime.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic|heif|avif|bmp|tiff?)$/i.test(name);
      return { isMedia: isImage || isVideo, isVideo, effectiveId: targetId, effectiveMime: mime };
    }

    let galleryItems = [];
    let galleryScrollRestorationY = 0;

    function showDriveDiagnostic(title, detailsHtml) {
      const box = document.getElementById("driveErrorContainer");
      if (!box) return;
      document.getElementById("driveErrorTitle").textContent = title;
      document.getElementById("driveErrorDetails").innerHTML = detailsHtml;
      box.classList.remove("hidden");
    }

    async function fetchDriveFolderContents(folderId, apiKey) {
      let items = [];
      let pageToken = "";
      do {
        const query = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
        const fields = encodeURIComponent("nextPageToken, files(id, name, mimeType, thumbnailLink, webContentLink, shortcutDetails)");
        const pageParam = pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "";
        const url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=${fields}&pageSize=500&orderBy=createdTime%20desc&supportsAllDrives=true&includeItemsFromAllDrives=true${pageParam}&key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        if (Array.isArray(data.files)) items = items.concat(data.files);
        pageToken = data.nextPageToken || "";
      } while (pageToken);
      return items;
    }

    async function loadGoogleDriveGallery() {
      const statusBadge = document.getElementById("driveSyncStatus");
      const counterBadge = document.getElementById("photoCounterBadge");
      if (statusBadge) statusBadge.classList.remove("hidden");
      document.getElementById("driveErrorContainer")?.classList.add("hidden");

      const folderId = extractCleanFolderId(SITE_CONFIG.googleDriveFolderId);
      const apiKey = (SITE_CONFIG.googleDriveApiKey || "").trim();

      if (!folderId || !apiKey) {
        statusBadge?.classList.add("hidden");
        showDriveDiagnostic("Missing Google Drive Credentials", "Please set <code>googleDriveFolderId</code> and <code>googleDriveApiKey</code>.");
        return;
      }

      try {
        const topFiles = await fetchDriveFolderContents(folderId, apiKey);
        let allFiles = [...topFiles];

        const subFolders = topFiles.filter(f => f.mimeType === "application/vnd.google-apps.folder" || (f.mimeType === "application/vnd.google-apps.shortcut" && f.shortcutDetails?.targetMimeType === "application/vnd.google-apps.folder"));
        for (const sf of subFolders) {
          const subId = sf.shortcutDetails?.targetId || sf.id;
          try {
            const subItems = await fetchDriveFolderContents(subId, apiKey);
            allFiles = allFiles.concat(subItems);
          } catch(e) {}
        }

        const mediaEntries = [];
        for (const file of allFiles) {
          const info = classifyMediaItem(file);
          if (info.isMedia) mediaEntries.push({ file, info });
        }

        if (mediaEntries.length === 0) {
          galleryItems = [];
          renderScatteredGrid();
          showDriveDiagnostic("Folder Connected — 0 Photos Visible", `Folder <code>${folderId}</code> returned 0 items. Please ensure General Access is set to <strong>Anyone with the link (Viewer)</strong> in Google Drive.`);
          return;
        }

        galleryItems = mediaEntries.map(({ file, info }, idx) => {
          const fileId = info.effectiveId;
          const isVideo = info.isVideo;
          const directMediaUrl = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(apiKey)}`;
          const lowResThumb = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, "=s300") : `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w300`;
          const fullMediaUrl = isVideo ? directMediaUrl : (file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+$/, "=s2400") : lowResThumb);
          return { id: fileId, name: file.name || `Memory-${idx+1}`, isVideo, thumbnailUrl: lowResThumb, directMediaUrl, fullUrl: fullMediaUrl, downloadUrl: directMediaUrl };
        });

        if (counterBadge) counterBadge.textContent = `${galleryItems.length} Memories`;
        renderScatteredGrid();
      } catch (err) {
        galleryItems = [];
        renderScatteredGrid();
        showDriveDiagnostic("Google Drive API Error", err.message);
      } finally {
        statusBadge?.classList.add("hidden");
      }
    }

    function getCuteDecorationSvg(idx) {
      const v = idx % 5;
      if (v === 0) return `<div class="absolute -top-2 -right-2 sm:-top-3.5 sm:-right-3.5 z-25 pointer-events-none drop-shadow-md"><svg class="w-5 h-5 sm:w-8 sm:h-8 text-[#e5c378]" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M24 24 C18 14 6 16 12 28 C16 34 22 28 24 24 Z" fill="rgba(229,195,120,0.3)"/><path d="M24 24 C30 14 42 16 36 28 C32 34 26 28 24 24 Z" fill="rgba(229,195,120,0.3)"/><circle cx="24" cy="24" r="3.5" fill="#f7f3ee" stroke="#c5a059"/></svg></div>`;
      if (v === 1) return `<div class="absolute -bottom-2 -left-2 sm:-bottom-3 sm:-left-3 z-25 pointer-events-none drop-shadow"><svg class="w-5 h-5 sm:w-9 sm:h-9 text-[#c5a059]" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 34 C14 28 26 20 34 8"/></svg></div>`;
      return `<div class="absolute -top-1.5 right-1.5 sm:-top-2.5 sm:right-4 z-25 pointer-events-none drop-shadow"><div class="w-4 h-4 sm:w-6 sm:h-6 rounded-full bg-[#171614]/85 border border-[#c5a059]/40 flex items-center justify-center text-[8px] text-[#e5c378]">♥</div></div>`;
    }

    let galleryCardElements = [];
    function renderScatteredGrid() {
      const grid = document.getElementById("scatteredGalleryGrid");
      if (!grid) return;
      grid.innerHTML = "";
      galleryCardElements = [];

      galleryItems.forEach((item, idx) => {
        const fig = document.createElement("figure");
        fig.className = "relative z-10 m-0 gallery-card-figure cursor-pointer group";
        const isEven = idx % 2 === 0;
        const colShift = isEven ? "-2%" : "2%";
        const tilt = isEven ? "-1.8deg" : "2deg";
        const deco = getCuteDecorationSvg(idx);
        const videoBadge = item.isVideo ? `<div class="absolute inset-0 flex items-center justify-center bg-black/25 pointer-events-none"><div class="w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-[#0e0e0d]/80 border border-[#e5c378]/70 flex items-center justify-center text-[#e5c378]"><svg class="w-3.5 h-3.5 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>` : "";

        fig.innerHTML = `
          <div class="relative aspect-[1/1.25] w-full p-1.5 sm:p-2.5 md:p-3 rounded-xl sm:rounded-2xl md:rounded-3xl bg-[#171614]/90 border border-[#c5a059]/35 hover:border-[#e5c378] transition-all duration-500 shadow-[0_10px_25px_rgba(0,0,0,0.65)] group-hover:shadow-[0_20px_45px_rgba(197,160,89,0.22)]" style="transform: translateX(${colShift}) rotateZ(${tilt});">
            ${deco}
            <div class="relative w-full h-full overflow-hidden rounded-lg sm:rounded-xl md:rounded-2xl bg-[#0e0e0d]">
              <img data-src="${item.thumbnailUrl}" alt="Memory ${idx+1}" loading="lazy" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-108 opacity-0 transition-opacity duration-300" />
              ${videoBadge}
            </div>
          </div>
        `;
        fig.addEventListener("click", () => {
          galleryScrollRestorationY = window.scrollY || window.pageYOffset;
          openStickyModal(idx);
        });
        grid.appendChild(fig);
        galleryCardElements.push({ figure: fig, item, loaded: false });
      });
      updateVisibleThumbnails();
    }

    function updateVisibleThumbnails() {
      const scrollY = window.scrollY || window.pageYOffset;
      const vh = window.innerHeight || 800;
      galleryCardElements.forEach(e => {
        if (e.loaded) return;
        const rect = e.figure.getBoundingClientRect();
        if (rect.top < scrollY + vh * 2 && rect.bottom >= -vh * 2) {
          const img = e.figure.querySelector("img");
          if (img && img.dataset.src) {
            img.src = img.dataset.src;
            img.onload = () => img.classList.remove("opacity-0");
            e.loaded = true;
          }
        }
      });
    }

    window.addEventListener("scroll", () => {
      updateVisibleThumbnails();
      const quickBtn = document.getElementById("quickScrollTopBtn");
      if (quickBtn) {
        if ((window.scrollY || window.pageYOffset) > window.innerHeight * 0.45) {
          quickBtn.style.opacity = "1"; quickBtn.style.pointerEvents = "auto";
        } else {
          quickBtn.style.opacity = "0"; quickBtn.style.pointerEvents = "none";
        }
      }
    }, { passive: true });

    // Lightbox & Slideshow logic
    const stickyModalOverlay = document.getElementById("stickyModalOverlay");
    const discreteStage = document.getElementById("discreteStage");
    const modalCardCurrent = document.getElementById("modalCardCurrent");
    const modalImgCurrent = document.getElementById("modalImgCurrent");
    const modalVideoCurrent = document.getElementById("modalVideoCurrent");
    const modalCardOutgoing = document.getElementById("modalCardOutgoing");
    const modalImgOutgoing = document.getElementById("modalImgOutgoing");

    let currentModalIndex = 0;
    let userZoomScale = 1, userPanX = 0, userPanY = 0, userRotationDeg = 0;
    let isSlideshowActive = false, slideshowTimer = null, slideshowIntervalSeconds = SITE_CONFIG.slideshowDefaultSeconds;

    function openStickyModal(idx) {
      if (!galleryItems.length) return;
      currentModalIndex = ((idx % galleryItems.length) + galleryItems.length) % galleryItems.length;
      renderActiveMediaInModal(galleryItems[currentModalIndex]);
      stickyModalOverlay.classList.remove("hidden");
      stickyModalOverlay.classList.add("flex");
      document.body.style.overflow = "hidden";
      history.pushState({ modalOpen: true }, "");
    }

    function closeStickyModal() {
      stopSlideshow();
      modalVideoCurrent.pause();
      modalVideoCurrent.removeAttribute("src");
      stickyModalOverlay.classList.add("hidden");
      stickyModalOverlay.classList.remove("flex");
      document.body.style.overflow = "";
      window.scrollTo({ top: galleryScrollRestorationY, behavior: "instant" });
    }

    function renderActiveMediaInModal(item) {
      userZoomScale = 1; userPanX = 0; userPanY = 0; userRotationDeg = 0;
      modalImgCurrent.style.transform = "none";
      if (item.isVideo) {
        modalImgCurrent.classList.add("hidden");
        modalVideoCurrent.classList.remove("hidden");
        modalVideoCurrent.src = item.fullUrl;
        modalVideoCurrent.play().catch(() => {});
      } else {
        modalVideoCurrent.pause();
        modalVideoCurrent.removeAttribute("src");
        modalVideoCurrent.classList.add("hidden");
        modalImgCurrent.classList.remove("hidden");
        modalImgCurrent.src = item.fullUrl;
      }
    }

    function toggleSlideshow() {
      if (isSlideshowActive) stopSlideshow();
      else startSlideshow();
    }
    function startSlideshow() { isSlideshowActive = true; updateSlideshowUI(); scheduleNextSlide(); }
    function stopSlideshow() { isSlideshowActive = false; if (slideshowTimer) clearTimeout(slideshowTimer); updateSlideshowUI(); }
    function scheduleNextSlide() {
      if (!isSlideshowActive) return;
      slideshowTimer = setTimeout(() => {
        if (isSlideshowActive) { transitionToPhoto(currentModalIndex + 1); scheduleNextSlide(); }
      }, slideshowIntervalSeconds * 1000);
    }
    function updateSlideshowUI() {
      const lbl = document.getElementById("slideshowLabel");
      if (lbl) lbl.textContent = isSlideshowActive ? "Pause" : "Slide";
    }

    function transitionToPhoto(targetIdx) {
      if (!galleryItems.length) return;
      currentModalIndex = ((targetIdx % galleryItems.length) + galleryItems.length) % galleryItems.length;
      renderActiveMediaInModal(galleryItems[currentModalIndex]);
    }

    document.getElementById("slideshowToggleBtn")?.addEventListener("click", toggleSlideshow);
    document.getElementById("closeStickyModalBtn")?.addEventListener("click", () => {
      if (window.history.state?.modalOpen) window.history.back();
      else closeStickyModal();
    });
    document.getElementById("modalPrevBtn")?.addEventListener("click", () => transitionToPhoto(currentModalIndex - 1));
    document.getElementById("modalNextBtn")?.addEventListener("click", () => transitionToPhoto(currentModalIndex + 1));
    document.getElementById("rotateMediaBtn")?.addEventListener("click", () => {
      userRotationDeg = (userRotationDeg + 90) % 360;
      modalImgCurrent.style.transform = `rotate(${userRotationDeg}deg)`;
    });
    document.getElementById("downloadMediaBtn")?.addEventListener("click", () => {
      const item = galleryItems[currentModalIndex];
      if (item) window.open(item.downloadUrl, "_blank");
    });

    window.addEventListener("popstate", () => {
      if (!stickyModalOverlay.classList.contains("hidden")) closeStickyModal();
    });

    window.onload = function() {
      loadGoogleDriveGallery();
    };
  </script>
</body>
</html>
